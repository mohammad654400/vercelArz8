name: Dockerized Next.js CI/CD

on:
  push:
    branches:
      - main
      - dev

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_HUB_USERNAME }}
          password: ${{ secrets.DOCKER_HUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v3
        with:
          context: .
          push: true
          tags: |
            your-docker-username/next-app:${{ github.sha }}
            your-docker-username/next-app:latest

      - name: Deploy to server
        run: |
          if [ "${GITHUB_REF}" == "refs/heads/main" ]; then
            PM2_APP_NAME="next-main"
            APP_PORT=3000
          elif [ "${GITHUB_REF}" == "refs/heads/dev" ]; then
            PM2_APP_NAME="next-dev"
            APP_PORT=3100
          fi

          ssh -o StrictHostKeyChecking=no -p 3031 root@65.21.239.21 "
            # Pull the Docker image
            docker pull your-docker-username/next-app:latest
            
            # Stop and remove old container if exists
            docker stop ${PM2_APP_NAME} || true
            docker rm ${PM2_APP_NAME} || true
            
            # Run new container
            docker run -d \
              --name ${PM2_APP_NAME} \
              --restart unless-stopped \
              -p ${APP_PORT}:${APP_PORT} \
              -e NODE_ENV=production \
              your-docker-username/next-app:latest
          "